services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hticket
      POSTGRES_PASSWORD: hticket
      POSTGRES_DB: hticket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hticket"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://hticket:hticket@db:5432/hticket
      SLIP_DIR: /data/slips
    ports:
      - "8080:8080"
    volumes:
      - slips:/data/slips
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  slips:
