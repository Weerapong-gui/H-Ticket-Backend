services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hticket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hticket}
      POSTGRES_DB: hticket
    # เปิดเฉพาะในเครื่องตัวเอง (ใช้ตอน cargo test) คนอื่นในเครือข่ายเข้าไม่ได้
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hticket"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://hticket:${POSTGRES_PASSWORD:-hticket}@db:5432/hticket
      PORT: "8080"
      SLIP_DIR: /data/slips
    ports:
      - "8080:8080"
    volumes:
      - slips:/data/slips
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  slips:
