services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hticket
      POSTGRES_PASSWORD: hticket
      POSTGRES_DB: hticket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hticket"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
